<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Service - İlham</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            border: 2px solid #f2a900;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(242, 169, 0, 0.2);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        h1 {
            color: #f2a900;
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .driver-name {
            font-size: 20px;
            color: #dddddd;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .btn-call {
            display: inline-block;
            background-color: #f2a900;
            color: #000000;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 25px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(242, 169, 0, 0.4);
            width: 100%;
        }
        .btn-call:hover {
            background-color: #ffc107;
            transform: translateY(-2px);
        }
        .info {
            mt: 20px;
            margin-top: 20px;
            font-size: 14px;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🚖</div>
        <h1>Taxi Service</h1>
        <div class="driver-name">İlham</div>
        
        <a href="tel:+905014712020" class="btn-call">
            📞 +90 501 471 20 20
        </a>

        <p class="info">7/24 Hızlı ve Güvenli Ulaşım</p>
    </div>

</body>
</html>
